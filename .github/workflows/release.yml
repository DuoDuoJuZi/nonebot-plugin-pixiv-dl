# @Author: DuoDuoJuZi
# @Date: 2026-09-30
name: 检查与发布 PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 安装 uv 和 Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.20"
          python-version: "3.10"
          enable-cache: false

      - name: 校验发布标签
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(uv version --short)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: 测试与代码检查
        run: |
          uv sync --extra dev --no-sources
          uv run --no-sync pytest -q
          uv run --no-sync ruff check .

      - name: 构建发行包
        run: uv build --no-sources

      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nonebot-plugin-pixiv-dl
    permissions:
      id-token: write
    steps:
      - name: 校验发布环境
        env:
          PYPI_RELEASE_ENABLED: ${{ vars.PYPI_RELEASE_ENABLED }}
        run: test "$PYPI_RELEASE_ENABLED" = "true"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.20"
          enable-cache: false

      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: 发布到 PyPI
        run: uv publish --trusted-publishing always dist/*
